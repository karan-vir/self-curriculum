[project]
name = "selfcurr"
version = "0.1.0"
description = "Does a small model learn faster when it picks its own training problems?"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=1.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfcurr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
